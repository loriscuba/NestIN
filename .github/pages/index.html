<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NestIN · Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #F8F4EC; color: #17305E; font-family: 'Nunito Sans', sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-family: 'Baloo 2', sans-serif; font-size: 40px; margin: 0 0 4px; }
    p.sub { margin: 0 0 32px; opacity: .8; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.card { display: block; background: #fff; border-radius: 20px; padding: 24px; text-decoration: none; color: inherit;
             border: 1px solid #ece4d4; border-top: 6px solid #F4C430; }
    a.card:hover { box-shadow: 0 6px 20px rgba(23,48,94,.12); }
    a.card h2 { font-family: 'Baloo 2', sans-serif; margin: 0 0 4px; font-size: 26px; }
    small { display: block; margin-top: 32px; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>NestIN</h1>
    <p class="sub">Demo per Asilo infantile G.B. Vadone, Quiliano (SV)</p>
    <div class="grid">
      <a class="card" href="./nestin/"><h2>NestIN</h2>Segreteria e maestre · da computer</a>
      <a class="card" href="./nestapp/"><h2>NestApp</h2>Genitori · da telefono</a>
    </div>
    <small>Dati di esempio, nessun dato reale. Ricaricando la pagina la demo riparte da zero.</small>
  </main>
</body>
</html>
